<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada · Abrigando Pequeños</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#e8ecff;text-align:center;
    background:radial-gradient(120% 90% at 85% 10%,#2b6bff 0%,#3a1fb8 40%,#050826 80%)}
  .copo{font-size:72px;line-height:1;display:inline-block;animation:gira 8s linear infinite;text-shadow:0 0 18px #22e3ff}
  @keyframes gira{to{transform:rotate(360deg)}}
  h1{font-size:clamp(26px,6vw,40px);margin:18px 0 10px}
  p{margin:0 auto 28px;max-width:420px;line-height:1.6;color:#b9c2ec}
  a{display:inline-block;padding:14px 26px;border-radius:14px;background:linear-gradient(90deg,#22e3ff,#4d8dff);color:#02041a;font-weight:800;text-decoration:none;box-shadow:0 0 22px rgba(34,227,255,.5)}
  @media (prefers-reduced-motion:reduce){.copo{animation:none}}
</style>
</head>
<body>
  <main>
    <span class="copo" aria-hidden="true">❄</span>
    <h1>Esta página se perdió en la nieve</h1>
    <p>El enlace que abriste no existe. Vuelve al inicio para ver a los niños que esperan su chamarra o su cobija.</p>
    <a href="/">Volver al inicio</a>
  </main>
</body>
</html>
